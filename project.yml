name: Pico
options:
  bundleIdPrefix: fr.vialet
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PicoCore:
    path: Packages/PicoCore
targets:
  Pico:
    type: application
    platform: macOS
    sources:
      - path: Pico
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: PicoCore
    info:
      path: Pico/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pico
        CFBundleName: Pico
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Aurelien Vialet"
        CFBundleURLTypes:
          - CFBundleURLName: fr.vialet.pico
            CFBundleURLSchemes: [pico]
        NSCalendarsFullAccessUsageDescription: "Pico affiche vos evenements du jour a cote de vos taches."
        NSAppleEventsUsageDescription: "Pico lit l'URL de la page ou du mail au premier plan pour pre-remplir une tache."
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleIconFile: AppIcon
    entitlements:
      path: Pico/Resources/Pico.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.vialet.pico
        ENABLE_HARDENED_RUNTIME: false
  PicoCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/PicoCore/Sources/picocore-check
        excludes: ["main.swift", "Check.swift"]
    dependencies:
      - package: PicoCore
schemes:
  Pico:
    build:
      targets:
        Pico: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PicoCoreTests]
